# Untuk Dokploy: tanpa Caddy dan tanpa port publik. HTTPS & domain diatur Dokploy (Traefik).
# Data disimpan di named volume supaya tidak hilang saat redeploy.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "true"
    volumes:
      - wedding_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wedding_data:
